<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />

    <title>Hamza — Junior Web Developer</title>
    <meta
      name="description"
      content="Portfolio of Hamza, a Junior Web Developer specializing in Laravel, PHP, JavaScript, Vue.js, REST APIs, and MySQL."
    />
    <meta name="author" content="Hamza" />
    <meta property="og:title" content="Hamza — Junior Web Developer" />
    <meta
      property="og:description"
      content="Junior Web Developer specializing in Laravel, PHP, JavaScript, Vue.js, REST APIs, and MySQL."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/hamza.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap"
    />

    <!-- Preloader: self-contained so it paints before app CSS/JS arrive -->
    <style>
      body.is-loading {
        overflow: hidden;
      }

      #preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background-color: oklch(0.145 0.03 270);
        transition:
          opacity 0.5s ease,
          visibility 0.5s ease;
      }

      #preloader.is-hiding {
        opacity: 0;
        visibility: hidden;
      }

      #preloader.is-gone {
        display: none;
      }

      .preloader-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
        padding: 0 24px;
      }

      .preloader-name {
        font-family: "Space Grotesk", sans-serif;
        font-weight: 700;
        font-size: clamp(34px, 6vw, 54px);
        letter-spacing: -0.03em;
        color: oklch(0.94 0.01 90);
        opacity: 0;
        animation: loader-rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.05s forwards;
      }

      .preloader-name .accent {
        display: inline-block;
        color: oklch(0.65 0.16 55);
        transform-origin: center bottom;
        animation: letter-wave 1.6s ease-in-out infinite;
      }

      .preloader-name .accent:nth-child(1) {
        animation-delay: 0s;
      }

      .preloader-name .accent:nth-child(2) {
        animation-delay: 0.28s;
      }

      .preloader-name .accent:nth-child(3) {
        animation-delay: 0.56s;
      }

      @keyframes letter-wave {
        0%,
        55%,
        100% {
          transform: translateY(0) scale(1);
          filter: brightness(1);
          text-shadow: 0 0 0 oklch(0.65 0.16 55 / 0);
        }
        20% {
          transform: translateY(-0.05em) scale(1.16);
          filter: brightness(1.5);
          text-shadow:
            0 0 18px oklch(0.65 0.16 55 / 0.9),
            0 0 44px oklch(0.65 0.16 55 / 0.5);
        }
      }

      .preloader-track {
        width: min(280px, 62vw);
        height: 3px;
        border-radius: 999px;
        background-color: oklch(0.21 0.035 270);
        overflow: hidden;
        opacity: 0;
        animation: loader-rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.15s forwards;
      }

      .preloader-fill {
        display: block;
        height: 100%;
        width: 0;
        border-radius: 999px;
        background-image: linear-gradient(
          90deg,
          oklch(0.65 0.16 55),
          oklch(0.72 0.14 55)
        );
        animation: loader-fill 1.6s cubic-bezier(0.4, 0, 0.2, 1) 0.25s forwards;
      }

      .preloader-chip {
        display: grid;
        place-items: center;
        width: 46px;
        height: 46px;
        border-radius: 14px;
        background-color: oklch(0.185 0.035 270);
        border: 1px solid oklch(1 0 0 / 8%);
        color: oklch(0.65 0.16 55);
        box-shadow: 0 0 44px -14px oklch(0.65 0.16 55 / 0.75);
        opacity: 0;
        animation: loader-rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.25s forwards;
      }

      @keyframes loader-rise {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes loader-fill {
        from {
          width: 0;
        }
        to {
          width: 100%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .preloader-name,
        .preloader-track,
        .preloader-chip {
          animation: none;
          opacity: 1;
          transform: none;
        }

        .preloader-name .accent {
          animation: none;
        }

        .preloader-fill {
          animation: none;
          width: 100%;
        }
      }
    </style>
    <noscript>
      <style>
        #preloader {
          display: none;
        }

        body.is-loading {
          overflow: auto;
        }
      </style>
    </noscript>
  </head>
  <body class="is-loading">
    <div id="preloader">
      <div class="preloader-inner">
        <div class="preloader-name">
          <span class="accent">H</span>amza<span class="accent">A</span>li<span class="accent">.</span>
        </div>
        <div class="preloader-track"><span class="preloader-fill"></span></div>
        <div class="preloader-chip">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <polyline points="16 18 22 12 16 6"></polyline>
            <polyline points="8 6 2 12 8 18"></polyline>
          </svg>
        </div>
      </div>
    </div>

    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
    <script>
      (function () {
        var loader = document.getElementById("preloader");
        if (!loader) return;

        var startedAt = Date.now();
        var MIN_MS = 1800;
        var MAX_MS = 6000;
        var hidden = false;

        function hide() {
          if (hidden) return;
          hidden = true;
          loader.classList.add("is-hiding");
          document.body.classList.remove("is-loading");
          setTimeout(function () {
            loader.classList.add("is-gone");
          }, 550);
        }

        function schedule() {
          setTimeout(hide, Math.max(0, MIN_MS - (Date.now() - startedAt)));
        }

        if (document.readyState === "complete") {
          schedule();
        } else {
          window.addEventListener("load", schedule, { once: true });
        }

        setTimeout(hide, MAX_MS);

        // Replay the intro — wired to the "Hamza" brand links (navbar + footer)
        var replayTimer = null;
        window.__replayPreloader = function (options) {
          if (!loader || !loader.parentNode) return;

          clearTimeout(replayTimer);
          hidden = false;

          // By default drop any #section hash so we land on the start.
          // Callers that only want the animation pass { keepLocation: true }.
          if (!(options && options.keepLocation)) {
            try {
              if (window.location.hash) {
                window.history.replaceState(
                  null,
                  "",
                  window.location.pathname + window.location.search,
                );
              }
            } catch (err) {}
            window.scrollTo(0, 0);
          }

          loader.classList.remove("is-hiding");
          loader.classList.remove("is-gone");
          document.body.classList.add("is-loading");

          // fresh copy so every CSS animation restarts from 0
          var fresh = loader.cloneNode(true);
          loader.parentNode.replaceChild(fresh, loader);
          loader = fresh;
          void loader.offsetWidth;

          replayTimer = setTimeout(hide, MIN_MS);
        };
      })();
    </script>
  </body>
</html>
